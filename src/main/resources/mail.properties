# Configuration SMTP pour l'envoi des mails de confirmation
# Pour Gmail : utiliser un "mot de passe d'application"
# (Compte Google -> Securite -> Mots de passe des applications),
# pas le mot de passe du compte.
# Pour les tests : Mailtrap.io ou tout autre SMTP de test.
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.user=votreadresse@gmail.com
mail.password=motdepasse_application
